name: E2E Triage

# Phase 1 of the AI factory (F3-61, docs/AI_FACTORY_DESIGN.md): comment-only
# auto-triage for e2e failures on preview runs.
#
# - Fires after every "Preview Environment" run and inspects the run's JOB
#   conclusions (not the run conclusion — a future advisory-tier job may be
#   continue-on-error, leaving the run green while the job failed).
# - Collects the Playwright error-context.md aria snapshots + the failing
#   spec source, fingerprints the normalized error text, and asks a cheap
#   model (claude-haiku-4-5) for a classification in
#   {app-bug, test-bug, spec-mismatch, flake, infra}.
# - Posts ONE comment per fingerprint on the PR (marker
#   `<!-- ai-triage:<fp> -->`); a repeat of the same failure never re-bills
#   and never re-comments. Hard cap: max 5 ai-triage comments per PR.
# - Comment-only by design: no fix PRs, no label writes, no merges. The
#   guardrail essentials (never weaken assertions/auth; human-owned domains
#   are flag-only) are embedded in the classifier's system prompt.

on:
  workflow_run:
    workflows: ["Preview Environment"]
    types: [completed]

permissions: {}

jobs:
  collect-and-classify:
    # Preview Environment also runs on schedule/workflow_dispatch (the
    # reaper); only PR-triggered runs can have e2e failures worth triaging.
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      TRIAGE_DIR: /tmp/e2e-triage
    steps:
      - name: Detect failed e2e jobs and PR number
        id: detect
        env:
          # Empty when the payload carries no PR association; fall back to
          # resolving by head branch below.
          EVENT_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          mkdir -p "${TRIAGE_DIR}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            --paginate \
            --jq '[.jobs[] | select(.conclusion == "failure") | select(.name | startswith("e2e")) | {name, id, html_url}]' \
            > "${TRIAGE_DIR}/failed-jobs.json"

          FAILED_COUNT=$(jq 'length' "${TRIAGE_DIR}/failed-jobs.json")
          if [ "${FAILED_COUNT}" = "0" ]; then
            echo "No failed e2e jobs in run ${RUN_ID}; nothing to triage."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR="${EVENT_PR}"
          if [ -z "${PR}" ]; then
            # workflow_run.pull_requests can be empty; resolve via head branch.
            PR=$(gh pr list -R "${GITHUB_REPOSITORY}" --head "${HEAD_BRANCH}" \
              --state open --json number --jq '.[0].number // empty')
          fi
          if [ -z "${PR}" ]; then
            echo "Could not resolve a PR for run ${RUN_ID} (branch ${HEAD_BRANCH}); skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Tier: the blocking suite job is named "e2e"; a future advisory
          # job is expected to carry "advisory" in its name. Any non-advisory
          # failure makes the whole event blocking.
          TIER=blocking
          if jq -e '(length > 0) and all(.[]; .name | test("advisory"))' \
              "${TRIAGE_DIR}/failed-jobs.json" > /dev/null; then
            TIER=advisory
          fi

          JOB_NAMES=$(jq -r '[.[].name] | join(", ")' "${TRIAGE_DIR}/failed-jobs.json")
          echo "Failed e2e job(s): ${JOB_NAMES} (tier: ${TIER}, PR #${PR})"
          {
            echo "proceed=true"
            echo "pr=${PR}"
            echo "tier=${TIER}"
            echo "job_names=${JOB_NAMES}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        if: steps.detect.outputs.proceed == 'true'
        with:
          # The failing spec source must come from the commit that failed,
          # not the default branch this workflow runs from.
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Collect error context and failing spec source
        if: steps.detect.outputs.proceed == 'true'
        env:
          PR: ${{ steps.detect.outputs.pr }}
        run: |
          # Artifact is only uploaded on failure and with
          # if-no-files-found: ignore, so tolerate a missing artifact.
          gh run download "${RUN_ID}" -R "${GITHUB_REPOSITORY}" \
            --name "playwright-artifacts-pr-${PR}" \
            --dir "${TRIAGE_DIR}/artifacts" \
            || echo "No playwright artifact for run ${RUN_ID}; falling back to job logs."

          # Primary error text: every error-context.md (Playwright's aria
          # snapshot + error summary per failed test), newest layout:
          # test-results/<spec-stem>-<test-title>-<project>/error-context.md
          : > "${TRIAGE_DIR}/error-context.txt"
          : > "${TRIAGE_DIR}/test-dirs.txt"
          if [ -d "${TRIAGE_DIR}/artifacts" ]; then
            find "${TRIAGE_DIR}/artifacts" -name 'error-context.md' | sort | while read -r F; do
              DIR=$(basename "$(dirname "$F")")
              echo "$DIR" >> "${TRIAGE_DIR}/test-dirs.txt"
              {
                echo "=== ${DIR}/error-context.md ==="
                cat "$F"
                echo
              } >> "${TRIAGE_DIR}/error-context.txt"
            done
          fi

          if [ ! -s "${TRIAGE_DIR}/error-context.txt" ]; then
            # Fallback: tail of the first failed job's log.
            JOB_ID=$(jq -r '.[0].id' "${TRIAGE_DIR}/failed-jobs.json")
            {
              echo "=== no error-context.md artifact; tail of failed job log ==="
              gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB_ID}/logs" | tail -c 6144 || true
            } > "${TRIAGE_DIR}/error-context.txt"
          fi

          # Failing spec source: match test-results dir names back to spec
          # files (dir name is prefixed with the spec file stem).
          : > "${TRIAGE_DIR}/spec-source.txt"
          for SPEC in apps/map/tests/e2e/*.spec.ts; do
            [ -e "$SPEC" ] || continue
            STEM=$(basename "$SPEC" .spec.ts)
            if [ ! -s "${TRIAGE_DIR}/test-dirs.txt" ] || grep -q "^${STEM}-" "${TRIAGE_DIR}/test-dirs.txt"; then
              {
                echo "=== ${SPEC} ==="
                cat "$SPEC"
                echo
              } >> "${TRIAGE_DIR}/spec-source.txt"
            fi
          done

      - name: Fingerprint and dedupe
        if: steps.detect.outputs.proceed == 'true'
        id: fingerprint
        env:
          PR: ${{ steps.detect.outputs.pr }}
        run: |
          # Normalize volatile substrings so the same failure always hashes
          # identically across runs (dedupe = never re-bill, never re-spam).
          sed -E \
            -e 's#https?://[^[:space:])"]+#<url>#g' \
            -e 's/[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z?/<ts>/g' \
            -e 's/\b[0-9a-f]{7,40}\b/<hash>/g' \
            -e 's/\b[0-9]+(\.[0-9]+)?m?s\b/<t>/g' \
            -e 's/pr-[0-9]+-/pr-N-/g' \
            "${TRIAGE_DIR}/error-context.txt" > "${TRIAGE_DIR}/normalized.txt"
          FP=$(sha256sum "${TRIAGE_DIR}/normalized.txt" | cut -c1-16)
          echo "fingerprint=${FP}" >> "$GITHUB_OUTPUT"
          echo "Error fingerprint: ${FP}"

          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments?per_page=100" \
            --paginate --jq '[.[].body]' | jq -s 'add' > "${TRIAGE_DIR}/comments.json"

          if jq -e --arg m "<!-- ai-triage:${FP} -->" '[.[] | select(contains($m))] | length > 0' \
              "${TRIAGE_DIR}/comments.json" > /dev/null; then
            echo "Fingerprint ${FP} already triaged on PR #${PR}; skipping (dedupe)."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Hard cap — the factory never floods a PR.
          TRIAGE_COUNT=$(jq '[.[] | select(contains("<!-- ai-triage:"))] | length' "${TRIAGE_DIR}/comments.json")
          if [ "${TRIAGE_COUNT}" -ge 5 ]; then
            echo "PR #${PR} already has ${TRIAGE_COUNT} ai-triage comments (cap 5); posting nothing."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Classify failure via Anthropic API
        if: steps.detect.outputs.proceed == 'true' && steps.fingerprint.outputs.proceed == 'true'
        id: classify
        env:
          ANTHROPIC_KEY: ${{ secrets.F3_AI_SDLC_CLAUDE_API_KEY }}
        run: |
          # ~6KB each of error context + spec source keeps the call cheap.
          head -c 6144 "${TRIAGE_DIR}/error-context.txt" > "${TRIAGE_DIR}/err-trunc.txt"
          head -c 6144 "${TRIAGE_DIR}/spec-source.txt" > "${TRIAGE_DIR}/spec-trunc.txt"

          SYSTEM_PROMPT=$(cat <<'EOF'
          You are the phase-1 triage classifier for F3 Nation's CI factory. You will be given the error context (Playwright aria snapshot / error output) and the source of the failing e2e test(s) from a preview-environment run.

          Guardrails (non-negotiable):
          - NEVER suggest weakening, removing, or loosening an assertion, validation, or auth check to make a test pass.
          - Findings that touch the human-owned domains — security, availability, scalability — must be FLAGGED for human review only; never propose an automated or code-level fix for them.
          - You produce analysis for a PR comment. You have no ability to change code, and must not imply you do.

          Classify the failure as exactly one of:
          - app-bug: the application behavior is wrong; the test correctly caught it.
          - test-bug: the test itself is incorrect (bad selector, wrong assumption, race in the test).
          - spec-mismatch: the test encodes an expectation that no longer matches the intended/spec'd behavior.
          - flake: nondeterministic failure (timeout, cold start, network blip) likely to pass on retry.
          - infra: the preview environment, CI runner, or tooling failed; not the app or the test.

          Respond with ONLY a single JSON object, no prose and no code fences:
          {"classification": "<one of the five>", "confidence": "high|medium|low", "rationale": "<= 120 words", "suggested_next_step": "<= 60 words"}
          EOF
          )

          jq -n \
            --arg model "claude-haiku-4-5-20251001" \
            --arg system "${SYSTEM_PROMPT}" \
            --rawfile err "${TRIAGE_DIR}/err-trunc.txt" \
            --rawfile spec "${TRIAGE_DIR}/spec-trunc.txt" \
            '{
              model: $model,
              max_tokens: 1500,
              system: $system,
              messages: [{
                role: "user",
                content: ("## Error context (truncated)\n\n" + $err + "\n\n## Failing test source (truncated)\n\n" + $spec)
              }]
            }' > "${TRIAGE_DIR}/payload.json"

          API_OK=true
          curl -sS --max-time 120 --fail-with-body \
            https://api.anthropic.com/v1/messages \
            -H "x-api-key: ${ANTHROPIC_KEY}" \
            -H "anthropic-version: 2023-06-01" \
            -H "content-type: application/json" \
            -d @"${TRIAGE_DIR}/payload.json" \
            > "${TRIAGE_DIR}/response.json" || API_OK=false

          # Defensive parse: pull the model text, extract the FIRST JSON
          # object in it, validate the shape. Any failure -> classify_ok=false
          # (the comment step posts a "failed to classify" note instead of
          # crashing the workflow).
          python3 - "$API_OK" <<'PYEOF'
          import json, os, sys

          triage_dir = os.environ["TRIAGE_DIR"]
          ok = sys.argv[1] == "true"
          result = None
          if ok:
              try:
                  with open(f"{triage_dir}/response.json") as f:
                      resp = json.load(f)
                  text = "".join(
                      b.get("text", "") for b in resp.get("content", [])
                      if b.get("type") == "text"
                  )
                  decoder = json.JSONDecoder()
                  start = text.find("{")
                  while start != -1:
                      try:
                          candidate, _ = decoder.raw_decode(text[start:])
                          if isinstance(candidate, dict):
                              result = candidate
                              break
                      except json.JSONDecodeError:
                          pass
                      start = text.find("{", start + 1)
              except (json.JSONDecodeError, OSError) as e:
                  print(f"Failed to read/parse API response: {e}")

          taxonomy = {"app-bug", "test-bug", "spec-mismatch", "flake", "infra"}
          if result is not None and (
              result.get("classification") not in taxonomy
              or result.get("confidence") not in {"high", "medium", "low"}
          ):
              print(f"Model returned out-of-schema JSON: {result}")
              result = None

          if result is None:
              print("Classification unavailable; comment will say so.")
              with open(f"{triage_dir}/classification.json", "w") as f:
                  json.dump({"ok": False}, f)
          else:
              out = {
                  "ok": True,
                  "classification": result["classification"],
                  "confidence": result["confidence"],
                  "rationale": str(result.get("rationale", ""))[:1200],
                  "suggested_next_step": str(result.get("suggested_next_step", ""))[:600],
              }
              with open(f"{triage_dir}/classification.json", "w") as f:
                  json.dump(out, f)
          PYEOF

      - name: Comment triage result on PR
        if: steps.detect.outputs.proceed == 'true' && steps.fingerprint.outputs.proceed == 'true'
        env:
          PR: ${{ steps.detect.outputs.pr }}
          TIER: ${{ steps.detect.outputs.tier }}
          JOB_NAMES: ${{ steps.detect.outputs.job_names }}
          FP: ${{ steps.fingerprint.outputs.fingerprint }}
        run: |
          # shellcheck disable=SC2016  # literal markdown backticks in sed
          FAILED_TESTS=$(sort -u "${TRIAGE_DIR}/test-dirs.txt" 2>/dev/null | sed 's/^/- `/; s/$/`/')
          [ -n "${FAILED_TESTS}" ] || FAILED_TESTS="- (no per-test artifact; see job log)"

          if jq -e '.ok' "${TRIAGE_DIR}/classification.json" > /dev/null; then
            CLASSIFICATION=$(jq -r '.classification' "${TRIAGE_DIR}/classification.json")
            CONFIDENCE=$(jq -r '.confidence' "${TRIAGE_DIR}/classification.json")
            RATIONALE=$(jq -r '.rationale' "${TRIAGE_DIR}/classification.json")
            NEXT_STEP=$(jq -r '.suggested_next_step' "${TRIAGE_DIR}/classification.json")
            VERDICT="**Classification:** \`${CLASSIFICATION}\` (confidence: ${CONFIDENCE})

          **Rationale:** ${RATIONALE}

          **Suggested next step:** ${NEXT_STEP}"
          else
            VERDICT="**Classification:** triage failed to classify this failure (API or parse error). A human should look at the run directly."
          fi

          cat > "${TRIAGE_DIR}/comment.md" <<EOF
          <!-- ai-triage:${FP} -->
          ### 🤖 AI triage — e2e failure (${TIER} tier)

          **Failed job(s):** ${JOB_NAMES}
          **Failed test(s):**
          ${FAILED_TESTS}

          ${VERDICT}

          [Failing run](${RUN_URL}) · fingerprint \`${FP}\` · comment-only phase-1 triage (F3-61) — classifications are advisory; a human owns every merge decision.
          EOF

          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
            -F "body=@${TRIAGE_DIR}/comment.md" > /dev/null
          echo "Posted triage comment on PR #${PR} (fingerprint ${FP})."
